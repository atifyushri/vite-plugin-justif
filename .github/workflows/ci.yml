name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        name: Check (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # findPackageJSON in the parity tests needs Node >= 22.14.
                node: [22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - run: bun install --frozen-lockfile
            # typecheck, lint, format check, build, tests
            - run: bun run check
