name: Release

on:
    push:
        branches: [main]

concurrency: release-${{ github.ref }}

jobs:
    release:
        # Opens/updates a "Version Packages" PR while changesets accumulate;
        # publishes to npm when that PR merges. Auth is npm trusted publishing
        # (OIDC, configured on npmjs.com for this repo + workflow file) — no
        # token secret; id-token: write is what makes it work, and provenance
        # attestation comes with it.
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - run: bun install --frozen-lockfile
            - uses: changesets/action@v1
              with:
                  version: bunx changeset version
                  publish: bunx changeset publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
